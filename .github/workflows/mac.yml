name: macOS build

on:
  push:
    branches: [main]
    paths: ['mac/**', 'browser/**', 'VERSION', '.github/workflows/mac.yml']
  workflow_dispatch:

permissions:
  contents: write

# only the newest push counts
concurrency:
  group: mac-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Workbench.app
        shell: bash
        run: |
          set -o pipefail
          bash mac/build.sh 2>&1 | tee build.log

      - name: Publish download/Workbench-mac.zip
        if: success()
        shell: bash
        run: |
          git config user.name "workbench-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp download/Workbench-mac.zip /tmp/Workbench-mac.zip
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/Workbench-mac.zip download/Workbench-mac.zip
          git add download/Workbench-mac.zip
          git commit -m "macOS build $(tr -d ' \r\n' < VERSION) [skip ci]" || exit 0
          git push origin HEAD:main

      - name: Keep the build log on failure (branch ci-log)
        if: failure()
        shell: bash
        run: |
          git config user.name "workbench-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp build.log /tmp/mac-build.log || echo "no log" > /tmp/mac-build.log
          git checkout --orphan ci-log
          git rm -rf --cached . > /dev/null
          mkdir -p ci && cp /tmp/mac-build.log ci/mac-build.log
          git add ci/mac-build.log
          git commit -m "mac build log"
          git push -f origin ci-log
